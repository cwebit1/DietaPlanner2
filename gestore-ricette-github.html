<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DietaPlanner — Gestore ricette (salvataggio GitHub)</title>
  <style>
    :root{color-scheme:dark;--bg:#111711;--card:#1b251c;--line:#526548;--green:#87a86c;--gold:#d7b35a;--red:#e57373;--text:#f4f5ef;--muted:#aeb9aa}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,sans-serif}
    header{position:sticky;top:0;z-index:2;background:rgba(17,23,17,.96);border-bottom:1px solid var(--line);padding:14px 18px}
    h1{font-size:1.15rem;margin:0 0 10px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input[type=search]{flex:1;min-width:210px}
    .head-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.head-row h1{margin:0 0 10px}
    #toggleSettings{margin-bottom:10px;padding:7px 10px;font-size:.85rem}
    .tokenbar{display:none;gap:8px;flex-wrap:wrap;margin-top:8px}.tokenbar.open{display:flex}.tokenbar input{flex:1;min-width:220px}
    .tokenbar .hint{width:100%;color:var(--muted);font-size:.78rem;margin-top:2px}
    button,input,textarea,select{font:inherit;color:inherit;background:#121a13;border:1px solid var(--line);border-radius:9px;padding:9px 11px}
    button{cursor:pointer;font-weight:700}button.primary{background:var(--green);color:#101510;border-color:var(--green)}button:disabled{opacity:.45;cursor:default}
    main{max-width:1100px;margin:auto;padding:16px}.status{color:var(--muted);margin:0 0 14px}.status strong{color:var(--text)}
    .recipe{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}.recipe.off{border-color:var(--red);opacity:.82}.recipe.orphan{border-style:dashed}.recipe.pending{border-color:var(--gold)}
    .head{display:flex;align-items:flex-start;gap:12px}.title{flex:1;min-width:0}.name{font-weight:800}.id{font:12px ui-monospace,monospace;color:var(--muted);overflow-wrap:anywhere}
    .availability{display:flex;align-items:center;gap:7px;color:var(--green);font-weight:800}.off .availability{color:var(--red)}
    label.field{display:block;margin-top:12px;color:var(--muted);font-size:.8rem;font-weight:700}.field input,.field textarea{display:block;width:100%;margin-top:5px;color:var(--text)}.field textarea{min-height:105px;resize:vertical}
    .photo{display:flex;gap:12px;align-items:flex-start;margin-top:12px}
    .thumb{width:120px;height:75px;border-radius:8px;border:1px solid var(--line);object-fit:cover;background:#0b0f0b;flex:none}
    .photo-controls{flex:1;min-width:0}
    .badge{display:inline-block;margin-left:7px;padding:2px 7px;border:1px solid var(--gold);border-radius:999px;color:var(--gold);font-size:.7rem}
    .empty{padding:30px;text-align:center;color:var(--muted)}
    #log{max-width:1100px;margin:0 auto 20px;padding:0 16px;font:12px ui-monospace,monospace;color:var(--muted);white-space:pre-wrap}
  </style>
</head>
<body>
  <header>
    <div class="head-row">
      <h1>Gestore ricette, foto e testi</h1>
      <button id="toggleSettings" type="button" aria-expanded="false">Impostazioni ▾</button>
    </div>
    <div class="tokenbar" id="settingsPanel">
      <input id="token" type="password" placeholder="Personal Access Token GitHub (contents:write)" autocomplete="off">
      <input id="owner" value="cwebit1" placeholder="owner" style="max-width:140px">
      <input id="repo" value="DietaPlanner2" placeholder="repo" style="max-width:170px">
      <input id="branch" value="main" placeholder="branch" style="max-width:110px">
      <div class="hint">Il token resta solo in memoria per questa sessione: non viene salvato da nessuna parte, va incollato di nuovo ogni volta che apri la pagina.</div>
    </div>
    <div class="toolbar" style="margin-top:8px">
      <input id="search" type="search" placeholder="Cerca nome o ID ricetta">
      <select id="filter" aria-label="Filtro">
        <option value="all">Tutte</option>
        <option value="enabled">Disponibili</option>
        <option value="disabled">Non disponibili</option>
        <option value="incomplete">Senza foto o testo</option>
        <option value="orphan">ID non più nel ricettario</option>
      </select>
      <button id="download">Scarica JSON</button>
      <button id="save" class="primary" disabled>Salva su GitHub</button>
    </div>
  </header>
  <main>
    <p id="status" class="status">Caricamento catalogo…</p>
    <div id="list"></div>
  </main>
  <div id="log"></div>

  <script src="nutrition-config.js"></script>
  <script src="engine-core.js"></script>
  <script>
    const memoryStores={};
    for(const nome of ['ingredienti','varianti','ricette','impostazioni','piano','consumoGiorno','inventario'])memoryStores[nome]=new Map();
    window.getAll=async nome=>[...(memoryStores[nome]||new Map()).values()].map(v=>structuredClone(v));
    window.getOne=async(nome,chiave)=>{const v=(memoryStores[nome]||new Map()).get(chiave);return v?structuredClone(v):null;};
    window.put=async(nome,valore)=>{(memoryStores[nome]||new Map()).set(valore.id??valore.chiave,structuredClone(valore));return valore;};
    window.delKey=async(nome,chiave)=>(memoryStores[nome]||new Map()).delete(chiave);
  </script>
  <script src="motor-v12.js"></script>
  <script>
    /* Dimensione uniforme di riferimento per le foto: 800x450, stesso
       rapporto 16:9 con cui il generatore produce le immagini
       (1792x1024). Resize proporzionale, mai ritaglio: vedi
       preparaFoto(). */
    const PHOTO_WIDTH=800,PHOTO_HEIGHT=450,PHOTO_QUALITY=.85;
    const IMAGES_DIR='assets/ricette/';

    const state={catalog:{versione:1,ricette:[]},recipes:[],names:new Map(),currentIds:new Set(),dirty:false,versionRaised:false,pendingPhotos:new Map()};
    const esc=value=>{const d=document.createElement('div');d.textContent=String(value??'');return d.innerHTML;};
    const log=line=>{const el=document.getElementById('log');el.textContent=(new Date().toLocaleTimeString()+'  '+line+'\n')+el.textContent;};

    function normalizeRecord(row){
      return {
        idRicetta:String(row&&row.idRicetta||''),
        percorsoImmagine:String(row&&row.percorsoImmagine||''),
        ricettaTestuale:String(row&&row.ricettaTestuale||''),
        disponibile:!(row&&row.disponibile===false)
      };
    }

    function applyCatalog(input){
      const rows=Array.isArray(input&&input.ricette)?input.ricette:[];
      const map=new Map();
      for(const raw of rows){
        const row=normalizeRecord(raw);
        if(!row.idRicetta)throw new Error('Trovato un record senza idRicetta.');
        if(map.has(row.idRicetta))throw new Error('ID duplicato: '+row.idRicetta);
        map.set(row.idRicetta,row);
      }
      for(const id of state.currentIds)if(!map.has(id))map.set(id,normalizeRecord({idRicetta:id}));
      const current=state.recipes.map(r=>map.get(r.id));
      const orphan=[...map.values()].filter(r=>!state.currentIds.has(r.idRicetta)).sort((a,b)=>a.idRicetta.localeCompare(b.idRicetta));
      state.catalog={versione:Number(input&&input.versione)||1,ricette:current.concat(orphan)};
      state.dirty=false;state.versionRaised=false;state.pendingPhotos.clear();render();
    }

    function credenziali(){
      return {token:document.getElementById('token').value.trim(),owner:document.getElementById('owner').value.trim(),repo:document.getElementById('repo').value.trim(),branch:document.getElementById('branch').value.trim()||'main'};
    }

    function markDirty(){
      state.dirty=true;
      aggiornaPulsanteSalva();
      renderStatus();
    }

    function aggiornaPulsanteSalva(){
      const {token}=credenziali();
      document.getElementById('save').disabled=!token||(!state.dirty&&!state.pendingPhotos.size);
    }

    function renderStatus(){
      const rows=state.catalog.ricette;
      const disabled=rows.filter(r=>r.disponibile===false).length;
      const incomplete=rows.filter(r=>!r.percorsoImmagine||!r.ricettaTestuale).length;
      const orphan=rows.filter(r=>!state.currentIds.has(r.idRicetta)).length;
      document.getElementById('status').innerHTML='<strong>'+rows.length+'</strong> record · <strong>'+disabled+'</strong> non disponibili · <strong>'+incomplete+'</strong> incompleti'+(orphan?' · <strong>'+orphan+'</strong> ID orfani':'')+((state.dirty||state.pendingPhotos.size)?' · modifiche non salvate su GitHub':'');
    }

    function visibleRows(){
      const query=document.getElementById('search').value.trim().toLowerCase();
      const filter=document.getElementById('filter').value;
      return state.catalog.ricette.filter(row=>{
        const current=state.currentIds.has(row.idRicetta);
        const name=state.names.get(row.idRicetta)||'';
        if(query&&!name.toLowerCase().includes(query)&&!row.idRicetta.toLowerCase().includes(query))return false;
        if(filter==='enabled'&&row.disponibile===false)return false;
        if(filter==='disabled'&&row.disponibile!==false)return false;
        if(filter==='incomplete'&&row.percorsoImmagine&&row.ricettaTestuale)return false;
        if(filter==='orphan'&&current)return false;
        return true;
      });
    }

    function estensionePerTipo(tipo){
      if(tipo==='image/png')return 'png';
      if(tipo==='image/jpeg')return 'jpg';
      return 'webp';
    }

    /* Nessun ritaglio: resize proporzionale puro (contain). Le foto del
       generatore sono sempre 16:9 (1792x1024), stesso rapporto del target
       800x450 - il resize riporta esattamente le stesse proporzioni senza
       perdere nessuna porzione dell'immagine. Se una foto arrivasse con un
       rapporto diverso, viene comunque scalata per intero (mai tagliata)
       e centrata su un canvas 800x450, con bordo trasparente residuo. */
    async function preparaFoto(file){
      const bitmap=await createImageBitmap(file);
      const canvas=document.createElement('canvas');
      canvas.width=PHOTO_WIDTH;canvas.height=PHOTO_HEIGHT;
      const ctx=canvas.getContext('2d');
      const scala=Math.min(PHOTO_WIDTH/bitmap.width,PHOTO_HEIGHT/bitmap.height);
      const larghezzaScalata=bitmap.width*scala,altezzaScalata=bitmap.height*scala;
      const dx=(PHOTO_WIDTH-larghezzaScalata)/2,dy=(PHOTO_HEIGHT-altezzaScalata)/2;
      ctx.drawImage(bitmap,dx,dy,larghezzaScalata,altezzaScalata);
      let blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',PHOTO_QUALITY));
      let estensione='webp';
      if(!blob){blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',PHOTO_QUALITY));estensione='jpg';}
      if(!blob)throw new Error('Il browser non riesce a codificare l\'immagine.');
      return {blob,estensione};
    }

    function render(){
      renderStatus();
      const rows=visibleRows();
      const list=document.getElementById('list');
      if(!rows.length){list.innerHTML='<div class="empty">Nessuna ricetta corrispondente.</div>';return;}
      list.innerHTML=rows.map(row=>{
        const current=state.currentIds.has(row.idRicetta);
        const name=state.names.get(row.idRicetta)||'Ricetta non più presente nel catalogo funzionale';
        const pending=state.pendingPhotos.get(row.idRicetta);
        const anteprimaSrc=pending?pending.url:(row.percorsoImmagine||'');
        return '<article class="recipe '+(row.disponibile===false?'off ':'')+(current?'':'orphan ')+(pending?'pending':'')+'" data-id="'+esc(row.idRicetta)+'">'+
          '<div class="head"><div class="title"><div class="name">'+esc(name)+(current?'':'<span class="badge">ID ORFANO</span>')+(pending?'<span class="badge">FOTO DA SALVARE</span>':'')+'</div><div class="id">'+esc(row.idRicetta)+'</div></div>'+
          '<label class="availability"><input type="checkbox" data-field="disponibile" '+(row.disponibile!==false?'checked':'')+'> <span>'+(row.disponibile!==false?'Disponibile':'Non disponibile')+'</span></label></div>'+
          '<div class="photo">'+(anteprimaSrc?'<img class="thumb" src="'+esc(anteprimaSrc)+'" alt="">':'<div class="thumb"></div>')+
          '<div class="photo-controls">'+
            '<input type="file" accept="image/*" data-action="foto">'+
            '<label class="field">Percorso immagine<input data-field="percorsoImmagine" value="'+esc(row.percorsoImmagine)+'" readonly placeholder="assets/ricette/'+esc(row.idRicetta)+'.webp"></label>'+
          '</div></div>'+
          '<label class="field">Ricetta testuale<textarea data-field="ricettaTestuale" placeholder="Ingredienti, dosi e procedimento…">'+esc(row.ricettaTestuale)+'</textarea></label></article>';
      }).join('');
    }

    function catalogForSave(){
      if(state.dirty&&!state.versionRaised){state.catalog.versione++;state.versionRaised=true;}
      return JSON.stringify(state.catalog,null,2)+'\n';
    }

    function downloadFile(){
      const blob=new Blob([catalogForSave()],{type:'application/json'});
      const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='db-visuale.json';a.click();URL.revokeObjectURL(url);
    }

    function bufferToBase64(buffer){
      let binario='';const bytes=new Uint8Array(buffer);
      for(let i=0;i<bytes.length;i++)binario+=String.fromCharCode(bytes[i]);
      return btoa(binario);
    }

    /* Legge lo sha corrente del file su GitHub (serve per l'update via
       Contents API): assente/404 = file non ancora esistente, nessun sha
       da passare (creazione nuova). */
    async function shaFileGitHub({token,owner,repo,branch},percorso){
      const risposta=await fetch('https://api.github.com/repos/'+owner+'/'+repo+'/contents/'+percorso+'?ref='+encodeURIComponent(branch),{
        headers:{Authorization:'token '+token,Accept:'application/vnd.github+json'}
      });
      if(risposta.status===404)return null;
      if(!risposta.ok)throw new Error('Lettura '+percorso+' fallita ('+risposta.status+'): '+(await risposta.text()));
      const dati=await risposta.json();
      return dati.sha;
    }

    async function scriviFileGitHub(cred,percorso,base64,messaggio,shaEsistente){
      const risposta=await fetch('https://api.github.com/repos/'+cred.owner+'/'+cred.repo+'/contents/'+percorso,{
        method:'PUT',
        headers:{Authorization:'token '+cred.token,Accept:'application/vnd.github+json','Content-Type':'application/json'},
        body:JSON.stringify(Object.assign({message:messaggio,content:base64,branch:cred.branch},shaEsistente?{sha:shaEsistente}:{}))
      });
      if(!risposta.ok)throw new Error('Scrittura '+percorso+' fallita ('+risposta.status+'): '+(await risposta.text()));
      return risposta.json();
    }

    async function salvaSuGitHub(){
      const cred=credenziali();
      if(!cred.token){alert('Incolla il token GitHub prima di salvare.');return;}
      const salva=document.getElementById('save');
      salva.disabled=true;
      try{
        /* 1) Ogni foto in attesa: un commit separato per file immagine. */
        for(const [idRicetta,pending] of state.pendingPhotos){
          const percorso=IMAGES_DIR+idRicetta+'.'+pending.estensione;
          log('Carico foto per '+idRicetta+' → '+percorso+' …');
          const buffer=await pending.blob.arrayBuffer();
          const shaEsistente=await shaFileGitHub(cred,percorso).catch(()=>null);
          const esito=await scriviFileGitHub(cred,percorso,bufferToBase64(buffer),'img: aggiorna foto '+idRicetta,shaEsistente);
          log('Foto '+idRicetta+' salvata — commit '+esito.commit.sha.slice(0,7));
          const row=state.catalog.ricette.find(r=>r.idRicetta===idRicetta);
          if(row)row.percorsoImmagine=percorso;
        }
        for(const pending of state.pendingPhotos.values())URL.revokeObjectURL(pending.url);
        state.pendingPhotos.clear();
        /* 2) Un solo commit per db-visuale.json con tutte le modifiche di
           testo/disponibilità/percorso accumulate (inclusi i percorsi
           delle foto appena caricate al punto 1). */
        if(state.dirty){
          log('Salvo db-visuale.json …');
          const contenuto=catalogForSave();
          const base64=btoa(unescape(encodeURIComponent(contenuto)));
          const shaEsistente=await shaFileGitHub(cred,'db-visuale.json').catch(()=>null);
          const esito=await scriviFileGitHub(cred,'db-visuale.json',base64,'db-visuale: aggiorna schede ricette',shaEsistente);
          log('db-visuale.json salvato — commit '+esito.commit.sha.slice(0,7));
        }
      }catch(errore){
        log('ERRORE: '+errore.message);
        alert('Salvataggio interrotto: '+errore.message);
      }finally{
        state.dirty=false;state.versionRaised=false;
        aggiornaPulsanteSalva();renderStatus();render();
      }
    }

    document.getElementById('list').addEventListener('input',event=>{
      const field=event.target.dataset.field;if(!field)return;
      const card=event.target.closest('[data-id]');const row=state.catalog.ricette.find(r=>r.idRicetta===card.dataset.id);if(!row)return;
      row[field]=field==='disponibile'?event.target.checked:event.target.value;
      if(field==='disponibile'){
        card.classList.toggle('off',!row.disponibile);
        event.target.nextElementSibling.textContent=row.disponibile?'Disponibile':'Non disponibile';
      }
      markDirty();
    });
    document.getElementById('list').addEventListener('change',async event=>{
      if(event.target.dataset.action!=='foto')return;
      const file=event.target.files[0];if(!file)return;
      const card=event.target.closest('[data-id]');const idRicetta=card.dataset.id;
      const row=state.catalog.ricette.find(r=>r.idRicetta===idRicetta);if(!row)return;
      try{
        const {blob,estensione}=await preparaFoto(file);
        const url=URL.createObjectURL(blob);
        const precedente=state.pendingPhotos.get(idRicetta);if(precedente)URL.revokeObjectURL(precedente.url);
        state.pendingPhotos.set(idRicetta,{blob,estensione,url});
        row.percorsoImmagine=IMAGES_DIR+idRicetta+'.'+estensione;
        markDirty();render();
      }catch(errore){alert('Impossibile elaborare la foto: '+errore.message);}
    });
    document.getElementById('search').addEventListener('input',render);
    document.getElementById('filter').addEventListener('change',render);
    document.getElementById('token').addEventListener('input',aggiornaPulsanteSalva);
    document.getElementById('save').addEventListener('click',()=>salvaSuGitHub());
    document.getElementById('download').addEventListener('click',downloadFile);
    document.getElementById('toggleSettings').addEventListener('click',()=>{
      const pannello=document.getElementById('settingsPanel');
      const aperto=pannello.classList.toggle('open');
      document.getElementById('toggleSettings').setAttribute('aria-expanded',String(aperto));
      document.getElementById('toggleSettings').textContent=aperto?'Impostazioni ▴':'Impostazioni ▾';
    });

    (async()=>{
      const [init,response]=await Promise.all([
        DietaPlannerMotorV12.inizializza({basePath:''}),
        fetch('db-visuale.json?v='+Date.now(),{cache:'no-store'})
      ]);
      if(!response.ok)throw new Error('Impossibile caricare db-visuale.json');
      state.recipes=DietaPlannerMotorV12.getRicette();
      state.names=new Map(state.recipes.map(r=>[r.id,r.nome]));
      state.currentIds=new Set(state.recipes.map(r=>r.id));
      applyCatalog(await response.json());
    })().catch(error=>{document.getElementById('status').textContent='Errore: '+error.message;});
  </script>
</body>
</html>
